[project]
name = "madr-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Felipe Vieira",email = "felipelolfe685@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14, <4.0"
dependencies = [
    "fastapi[standard] (>=0.159.1,<0.160.0)",
    "pydantic[email] (>=2.14.1,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pytest-asyncio (>=1.4.1,<2.0.0)",
    "testcontainers[postgres] (>=4.15.0,<5.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.taskipy.tasks]
run = 'fastapi dev src/madr_api/app.py'

pre_test = 'task lint'
test = 'pytest -s -x --cov=madr_api -vv'

lint = 'ruff check . && ruff format --check .'
format = 'ruff check . --fix && ruff format'
post_test = 'coverage html'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
asyncio_default_fixture_loop_scope = 'function'
asyncio_mode = "auto"

[tool.coverage.run]
concurrency = ["thread", "greenlet"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "typos (>=1.51.1,<2.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)"
]
